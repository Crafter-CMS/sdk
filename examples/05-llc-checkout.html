<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLC Checkout (Stripe Payment Element)</title>
  <!--
    CrafterPayments cart payment when the seller is Crafter Technologies LLC (SDK v1.2.0).
    - The SDK does not include Stripe.js; this page loads Stripe.js from js.stripe.com only when an LLC response arrives.
    - For testing use Stripe test mode (pk_test_...) and the test card: 4242 4242 4242 4242, any future date, any CVC.
      3DS test: 4000 0027 6000 3184. Do not use a real card.
    - Works in storefront mode (Liquid theme, the /api/storefront proxy). The user must be logged in.
  -->
  <script src="../dist/crafter.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #fafafa; max-width: 520px; margin: 40px auto; padding: 0 16px; }
    .card { background: #141b24; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #a1a1a1; margin: 10px 0 4px; }
    input, select, button { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.15); background: #0a0a0a; color: #fafafa; }
    button { background: #2563eb; border: 0; font-weight: 600; margin-top: 16px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
    .total { font-weight: 700; border-top: 1px solid rgba(255,255,255,.1); margin-top: 6px; padding-top: 8px; }
    .error { color: #ff6467; font-size: 14px; min-height: 20px; margin-top: 10px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Checkout</h1>

  <form id="buyer-form" class="card">
    <label for="name">Full name</label>
    <input id="name" required value="Test Buyer" />
    <label for="email">Email</label>
    <input id="email" type="email" required value="buyer@example.com" />
    <label for="country">Country</label>
    <select id="country">
      <option value="US">United States</option>
      <option value="DE">Germany</option>
      <option value="GB">United Kingdom</option>
      <option value="TR">Türkiye</option>
    </select>
    <div id="postal-wrap">
      <label for="postal">Postal code (US / Canada)</label>
      <input id="postal" value="10001" />
    </div>
    <button id="start" type="submit">Continue to payment</button>
    <div id="form-error" class="error"></div>
  </form>

  <section id="pay" class="card hidden">
    <div id="summary"></div>
    <div id="payment-element" style="margin-top:16px"></div>
    <button id="pay-button" type="button">Pay</button>
    <div id="pay-error" class="error"></div>
  </section>

  <section id="result" class="card hidden" role="status" aria-live="polite"></section>

  <script>
    // --- Configuration (sample values) ---
    const WEBSITE_ID = 'your-website-id';
    const CART = [{ productId: 'demo-product-id', quantity: 1 }];

    const crafter = new Crafter({
      // Given here if the backend does not return a publishable key (it is not secret)
      stripePublishableKey: 'pk_test_REPLACE_ME',
    });

    const $ = (id) => document.getElementById(id);
    const fmt = (n, c) => Crafter.utils.formatMoney(n, c);
    const RESULT_TEXT = {
      success: 'Payment received, your order was delivered.',
      processing: 'Payment received, delivery in progress.',
      pending: 'Payment confirmation may take a few minutes. You can track it on the My Orders page.',
      refunded: 'Could not be delivered because the product sold out; your payment was refunded.',
      needs_review: 'Payment received but delivery is under review. Our support team will contact you.',
      failed: 'Payment could not be collected.',
    };

    // Stripe.js is loaded only on an LLC response, once
    let stripeJs;
    function loadStripeJs() {
      if (!stripeJs) {
        stripeJs = window.Stripe
          ? Promise.resolve(window.Stripe)
          : new Promise((resolve, reject) => {
              const s = document.createElement('script');
              s.src = 'https://js.stripe.com/v3/';
              s.onload = () => resolve(window.Stripe);
              s.onerror = () => reject(new Error('Could not load Stripe.js'));
              document.head.appendChild(s);
            });
      }
      return stripeJs;
    }

    function renderSummary(session) {
      const tax = session.tax;
      const rows = [];
      if (tax) {
        rows.push(`<div class="row"><span>Subtotal</span><span>${fmt(tax.subtotal, session.currency)}</span></div>`);
        for (const line of tax.lines) {
          const region = [line.country, line.state].filter(Boolean).join('-');
          rows.push(`<div class="row"><span>${(line.taxType || 'tax').toUpperCase()} ${region} (${line.rate}%)</span><span>${fmt(line.amount, session.currency)}</span></div>`);
        }
      }
      rows.push(`<div class="row total"><span>Total</span><span>${fmt(session.amount, session.currency)}</span></div>`);
      const p = session.presentment; // store amount when paying in the customer currency
      if (p) rows.push(`<div class="row"><span>Store amount</span><span>${fmt(p.storeAmount, p.storeCurrency)}</span></div>`);
      $('summary').innerHTML = rows.join('');
    }

    function showResult(outcome) {
      $('pay').classList.add('hidden');
      $('result').classList.remove('hidden');
      $('result').textContent = RESULT_TEXT[outcome] || RESULT_TEXT.pending;
    }

    async function mountPaymentElement(session) {
      if (!session.publishableKey) throw new Error('Stripe publishable key is not configured');
      const Stripe = await loadStripeJs();
      const stripe = Stripe(session.publishableKey);
      const elements = stripe.elements({ clientSecret: session.clientSecret, appearance: { theme: 'night' } });
      elements.create('payment', { layout: 'tabs' }).mount('#payment-element');

      $('pay-button').onclick = async () => {
        $('pay-button').disabled = true;
        $('pay-error').textContent = '';
        try {
          const returnUrl = new URL(location.href);
          returnUrl.searchParams.set('stripe_payment_id', session.paymentId);
          const { error } = await stripe.confirmPayment({
            elements,
            redirect: 'if_required',
            confirmParams: { return_url: returnUrl.toString() },
          });
          if (error) {
            // The Payment Element shows missing fields itself; card declines etc. land here. The same form can be retried.
            if (error.type !== 'validation_error') $('pay-error').textContent = error.message;
            return;
          }
          $('pay-button').textContent = 'Verifying…';
          const result = await crafter.payments.waitForResult(session.paymentId);
          showResult(result.outcome);
        } finally {
          $('pay-button').disabled = false;
        }
      };
    }

    // Return from the full-page 3DS redirect
    const returnedId = new URLSearchParams(location.search).get('stripe_payment_id');
    if (returnedId) {
      $('buyer-form').classList.add('hidden');
      crafter.payments.waitForResult(returnedId).then((r) => showResult(r.outcome));
    }

    $('country').onchange = () => {
      $('postal-wrap').classList.toggle('hidden', !['US', 'CA'].includes($('country').value));
    };

    $('buyer-form').onsubmit = async (event) => {
      event.preventDefault();
      $('form-error').textContent = '';
      $('start').disabled = true;
      try {
        const providers = await crafter.payments.getPublicProviders();
        const provider = providers.find((p) => String(p.provider).toLowerCase() === 'crafterpayments');
        if (!provider) throw new Error('CrafterPayments is not enabled for this store');

        const country = $('country');
        const res = await crafter.cart.checkout(
          {
            websiteId: WEBSITE_ID,
            providerId: provider.id,
            provider: 'CrafterPayments',
            items: CART,
            user: { name: $('name').value.trim(), email: $('email').value.trim(), address: country.selectedOptions[0].text },
            billingCountry: country.value,
            ...(['US', 'CA'].includes(country.value) ? { billingPostalCode: $('postal').value.trim() } : {}),
          },
          // Payment in the customer currency: a locked quote is fetched; if disabled, pays in the store currency
          { legalTerms: { version: 'example-terms-v1' }, useCustomerCurrency: true }
        );

        if (res.delivered) return showResult('success'); // paid with balance
        if (!res.stripe) throw new Error('Unexpected response: this example only shows the seller LLC flow');

        renderSummary(res.stripe);
        $('buyer-form').classList.add('hidden');
        $('pay').classList.remove('hidden');
        await mountPaymentElement(res.stripe);
      } catch (err) {
        const { isOutOfStockError, isPaymentProviderError } = window.CrafterSDK;
        if (isOutOfStockError(err)) {
          $('form-error').textContent = `Sold-out products: ${err.productIds.join(', ')}`;
        } else if (isPaymentProviderError(err)) {
          $('form-error').textContent = err.message + (err.retryable ? ' (try again shortly)' : '');
        } else {
          $('form-error').textContent = err.message || 'Could not start the payment';
        }
      } finally {
        $('start').disabled = false;
      }
    };
  </script>
</body>
</html>
